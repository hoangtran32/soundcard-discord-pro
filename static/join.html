<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Mở SoundCard</title>
    <style>
        :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #0a0e17; color: #f1f5f9; }
        body { display: grid; place-items: center; min-height: 100vh; margin: 0; }
        main { box-sizing: border-box; width: min(90%, 30rem); padding: 1.5rem; border: 1px solid #27364c; border-radius: 1rem; background: #121c2d; }
        h1 { margin: 0; }
        a { color: #8be8ff; }
    </style>
    <script src="/static/js/join.js" defer></script>
</head>
<body>
    <main>
        <h1>SoundCard Discord</h1>
        <p id="join-status" role="status">Đang mở trình phát…</p>
        <a href="/" id="join-login" hidden>Đăng nhập bằng mật khẩu</a>
        <noscript>Bật JavaScript để dùng link mời.</noscript>
    </main>
</body>
</html>
